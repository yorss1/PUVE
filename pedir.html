    var fila2 = $('div', 'row'); fila2.style.marginTop = '14px'; var seg = $('button', 'btn sec', 'Seguir pidiendo'); seg.type = 'button'; seg.onclick = cerrarHoja; var env = $('button', 'btn', 'Enviar pedido'); env.type = 'button'; $$(fila2, [seg, env]); hj.appendChild(fila2);
