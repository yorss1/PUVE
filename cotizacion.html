<style>:root{--fondo:#fafafa;--tx:#111;--sub:#666;--borde:#ddd;--ac:#111;--ok:#15803d;--er:#b91c1c}@media(prefers-color-scheme:dark){:root{--fondo:#111;--tx:#f4f4f4;--sub:#aaa;--borde:#333;--ac:#f4f4f4}}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--tx);font:16px/1.45 system-ui,Arial,sans-serif}main{max-width:480px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}p.s{color:var(--sub);margin:0 0 16px}

<body><main><h1 id="neg">Cotización</h1><p class="s" id="sub"></p><div id="c"></div><div id="bt" style="display:none"><button id="ba" type="button">Aceptar cotización</button><button id="br" type="button" class="t">No la acepto</button></div><div class="m" id="m" role="status"></div></main><script>
var SUPA='https://ckzueunptmlqmtypowmg.supabase.co',KEY='sb_publishable_jkE5ikAW_a0OfE2S-6u3VA_P8uEzUSp',H={};(location.hash||'').replace(/^#/,'').split('&').forEach(function(p){var k=p.split('=');H[k[0]]=decodeURIComponent(k[1]||'')});
var UU=/^[0-9a-f-]{36}$/i,NEG=H.n||'';function $(i){return document.getElementById(i)}
function api(b){var c=window.AbortController?new AbortController():null,t=c?setTimeout(function(){c.abort()},30000):null;return fetch(SUPA+'/functions/v1/pedido-qr',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(b),signal:c?c.signal:undefined}).then(function(r){return r.json().catch(function(){return null}).then(function(d){clearTimeout(t);return{ok:r.ok,d:d}})}).catch(function(){clearTimeout(t);return{ok:false,d:{error:'Sin conexión. Revisa tu internet e intenta de nuevo.'}}})}

function pinta(d){$('neg').textContent=(d.negocio||'Cotización')+' · Folio '+d.folio;$('sub').textContent='Para '+d.cliente+(d.vence?' · Vigente hasta '+new Date(d.vence).toLocaleDateString('es-MX'):'');
var t=document.createElement('table'),h=document.createElement('tr');['Concepto','Cant.','Importe'].forEach(function(x){var th=document.createElement('th');th.textContent=x;h.appendChild(th)});t.appendChild(h);
(Array.isArray(d.items)?d.items:[]).forEach(function(i){var r=document.createElement('tr');[i.nombre||i.descripcion||'Concepto',String(i.cantidad||1),money((Number(i.precio||i.precio_unitario)||0)*(Number(i.cantidad)||1))].forEach(function(x){var td=document.createElement('td');td.textContent=x;r.appendChild(td)});t.appendChild(r)});
var f=document.createElement('tr');['Total','',money(d.total)].forEach(function(x){var td=document.createElement('th');td.textContent=x;f.appendChild(td)});t.appendChild(f);$('c').textContent='';$('c').appendChild(t);
if(d.notas){var p=document.createElement('p');p.textContent=d.notas;$('c').appendChild(p)}
if(d.estado==='enviada'&&d.vigente)$('bt').style.display='block';else{$('bt').style.display='none';msg(d.estado==='aceptada'?'Esta cotización ya fue aceptada.':d.estado==='rechazada'?'Esta cotización fue rechazada.':'Esta cotización ya venció. Pide una nueva al negocio.',d.estado==='aceptada')}}
if(!UU.test(NEG)||!UU.test(ID)){$('neg').textContent='Enlace no válido';$('sub').textContent='Pide el enlace de nuevo al negocio.'}
else api({accion:'cotizacion',negocio:NEG,id:ID}).then(function(r){if(r.ok&&r.d)pinta(r.d);else{$('neg').textContent='Cotización no encontrada';msg((r.d&&r.d.error)||'')}});
function resp(v){$('ba').disabled=$('br').disabled=true;msg('Enviando…',true);api({accion:'cotizacion_responder',negocio:NEG,id:ID,respuesta:v}).then(function(r){if(r.ok){$('bt').style.display='none';msg(v==='aceptada'?'¡Gracias! Registramos que aceptaste. El negocio se pondrá en contacto.':'Registramos tu respuesta. Gracias.',true)}else{$('ba').disabled=$('br').disabled=false;msg((r.d&&r.d.error)||'No se pudo enviar.')}})}
$('ba').onclick=function(){resp('aceptada')};$('br').onclick=function(){resp('rechazada')};</script></body></html>
