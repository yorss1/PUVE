  }
  function visibles(){ return !filtro ? datos.pedidos : datos.pedidos.filter(function(p){ return p.items.some(function(i){ return (i.categoria || 'Sin estación') === filtro; }); }); }
  function pintaBarra(e){ var pc = Math.min(100, seg(e.dataset.d) / (Number(e.dataset.m) * 60) * 100); e.style.width = pc + '%'; e.style.background = pc >= 100 ? 'var(--err)' : (pc >= 80 ? 'var(--ala)' : 'var(--ok)'); }

  // Tarjeta de pedido
  function tarjeta(p){
    var u = urgente(p), desde = p.estado === 'listo' ? p.actualizado_en : p.creado_en;
    var c = mk('div', 'tj' + (p.estado === 'por_confirmar' ? ' nuevo' : '') + (u ? ' urg' : '') + (seleccion === p.mesa ? ' sel' : ''));
    c.style.setProperty('--c', p.estado === 'por_confirmar' ? 'var(--foco)' : (p.estado === 'preparando' ? 'var(--ala)' : 'var(--ok)'));
    var cab = mk('div', 'cab'), izq = mk('div');
    izq.appendChild(mk('div', 'mesa', p.mesa === 'BARRA' ? 'Barra' : 'Mesa ' + p.mesa));
    if(p.alias) izq.appendChild(mk('div', 'alias', p.alias));
    var t = mk('span', 't' + (u ? ' tarde' : ''), mmss(desde)); t.dataset.d = desde;
    cab.appendChild(izq); cab.appendChild(t); c.appendChild(cab);
    if(p.estado === 'preparando' && p.minutos){
      c.appendChild(mk('div', 'prom', 'Prometido: ' + p.minutos + ' min'));
      var b = mk('div', 'barra'), i = mk('i'); i.dataset.d = p.creado_en; i.dataset.m = p.minutos; pintaBarra(i); b.appendChild(i); c.appendChild(b);
    }
    var ult = null;
    p.items.forEach(function(i){
      var cat = i.categoria || 'Sin estación';
      if(!filtro && cat !== ult){ c.appendChild(mk('div', 'cat', cat)); ult = cat; }
      var f = mk('div', 'it' + (filtro && cat !== filtro ? ' at' : '')), d = mk('div');
      f.appendChild(mk('span', 'q', i.cantidad + '×')); d.appendChild(mk('div', null, i.nombre));
      var ops = (i.opciones || []).map(function(o){ return o.o ? (o.g === 'Sin' ? { s: 1, x: 'SIN ' + o.o } : { x: (o.g ? o.g + ': ' : '') + o.o }) : { x: o.nombre || '' }; }).filter(function(o){ return o.x; });
      if(ops.length){ var w = mk('div', 'ops'); ops.forEach(function(o){ w.appendChild(mk('span', o.s ? 'sin' : null, o.x)); }); d.appendChild(w); }
      f.appendChild(d); c.appendChild(f);
    });
    if(p.nota) c.appendChild(mk('div', 'nota', '📝 ' + p.nota));
    var acc = mk('div', 'acc');
    if(p.estado === 'por_confirmar'){
      acc.appendChild(mk('div', 'cap', 'Aceptar y prometer (minutos):'));
      [10, 15, 20, 30].forEach(function(mn){ var bt = mk('button', 'btn', String(mn)); bt.type = 'button'; bt.onclick = function(ev){ ev.stopPropagation(); cambiar(p, 'preparando', mn, bt); }; acc.appendChild(bt); });
    } else if(p.estado === 'preparando'){
      var bl = mk('button', 'btn ok', '✓ Listo'); bl.type = 'button'; bl.onclick = function(ev){ ev.stopPropagation(); cambiar(p, 'listo', null, bl); }; acc.appendChild(bl);
    } else c.appendChild(mk('div', 'esp', 'Listo: esperando al mesero'));
    if(acc.children.length) c.appendChild(acc);
    c.onclick = function(){ seleccion = seleccion === p.mesa ? null : p.mesa; pintar(); };
    return c;
  }
  function cambiar(p, estado, minutos, boton){
    if(enviando[p.id]) return; enviando[p.id] = true; boton.disabled = true;
    api({ accion: 'estado', id: p.id, estado: estado, minutos: minutos }).then(function(r){
      delete enviando[p.id];
      if(r.status === 404){ enlaceMuerto(); return; }
      if(!r.ok) avisar((r.d && r.d.error) || 'No se pudo cambiar el pedido. Revisa la conexión.');
      cargar();
    });
  }
  function avisar(t){ var a = $('aviso'); a.textContent = t; a.style.display = 'block'; clearTimeout(avisar.t); avisar.t = setTimeout(function(){ a.style.display = 'none'; }, 6000); }

  // Pintar
  function estadosPorMesa(){
    var out = {}, orden = { por_confirmar: 3, preparando: 2, listo: 1 };
    datos.pedidos.forEach(function(p){
      var e = out[p.mesa] || { estado: p.estado, n: 0, minutos: 0, urgente: false };
      e.n++; if(orden[p.estado] > orden[e.estado]) e.estado = p.estado;
      e.minutos = Math.max(e.minutos, minDesde(p.estado === 'listo' ? p.actualizado_en : p.creado_en)); if(urgente(p)) e.urgente = true;
      out[p.mesa] = e;
    });
    return out;
  }
  function pintar(){
    var v = visibles(), col = { por_confirmar: $('lNuevos'), preparando: $('lPrep'), listo: $('lListos') }, cnt = { por_confirmar: 0, preparando: 0, listo: 0 };
    var sc = {}, scMain = $('principal').scrollTop; Object.keys(col).forEach(function(k){ sc[k] = col[k].scrollTop; col[k].textContent = ''; });
    v.forEach(function(p){ cnt[p.estado]++; col[p.estado].appendChild(tarjeta(p)); });
    Object.keys(col).forEach(function(k){ if(!cnt[k]) col[k].appendChild(mk('div', 'vacio', k === 'por_confirmar' ? 'Sin pedidos nuevos' : (k === 'preparando' ? 'Nada en preparación' : 'Nada por entregar'))); col[k].scrollTop = sc[k]; });
    $('nNuevos').textContent = $('tN').textContent = cnt.por_confirmar; $('nPrep').textContent = $('tP').textContent = cnt.preparando; $('nListos').textContent = $('tL').textContent = cnt.listo;
    $('tN').parentNode.classList.toggle('hay', cnt.por_confirmar > 0);
    // filtros por estación (categorías de los productos pedidos)
    var cats = {}; datos.pedidos.forEach(function(p){ p.items.forEach(function(i){ cats[i.categoria || 'Sin estación'] = 1; }); });
    var nom = Object.keys(cats).sort(), f = $('filtros'); f.textContent = '';
    if(filtro && !cats[filtro]) filtro = null;
    if(nom.length > 1){
      var todo = mk('button', 'btn' + (!filtro ? ' on' : ''), 'Todo'); todo.onclick = function(){ filtro = null; pintar(); }; f.appendChild(todo);
      nom.forEach(function(n){ var b = mk('button', 'btn' + (filtro === n ? ' on' : ''), n); b.onclick = function(){ filtro = n; pintar(); }; f.appendChild(b); });
    }
    pintarPlano(); marcarTabs(); $('principal').scrollTop = scMain;
  }
  function pintarPlano(){
    var tiene = datos.plano && datos.plano.elementos && datos.plano.elementos.length, est = estadosPorMesa(), hay = tiene || Object.keys(est).length;
    $('principal').classList.toggle('sinplano', !hay); $('der').classList.toggle('sin', !hay); $('tS').classList.toggle('sin', !hay);
    if(!hay && vista === 's') ver('n');
    $('plano').style.display = tiene ? '' : 'none';
    if(tiene) window.PuvePlano.dibujar($('plano'), datos.plano, { tema: oscuro ? 'oscuro' : 'claro', estados: est, seleccion: seleccion, onMesa: function(mesa){ seleccion = seleccion === mesa ? null : mesa; pintar(); } });
    var dib = {}; if(tiene) datos.plano.elementos.forEach(function(e){ if(e.mesa) dib[e.mesa] = 1; });
    var b = $('bandeja'); b.textContent = '';
    Object.keys(est).filter(function(mesa){ return !dib[mesa]; }).forEach(function(mesa){
      var ch = mk('button', 'btn' + (seleccion === mesa ? ' on' : ''), (mesa === 'BARRA' ? 'Barra' : 'Mesa ' + mesa) + ' · ' + est[mesa].n); ch.onclick = function(){ seleccion = seleccion === mesa ? null : mesa; pintar(); }; b.appendChild(ch);
    });
  }
  function marcarTabs(){ Array.prototype.forEach.call($('tabs').children, function(b){ var on = b.dataset.v === vista; b.classList.toggle('on', on); if(on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); }); }
  function ver(v){ vista = v; $('principal').dataset.v = v; marcarTabs(); $('principal').scrollTop = 0; }
  $('tabs').onclick = function(e){ var b = e.target.closest('button'); if(b) ver(b.dataset.v); };

  // Carga y tiempo real
  function conectado(ok){ $('punto').className = 'punto' + (ok ? '' : ' off'); $('estadoRed').textContent = ok ? 'En vivo' : 'Sin conexión, reintentando…'; }
  function cargar(){
    if(muerto) return Promise.resolve();
    if(cargando){ otraVez = true; return Promise.resolve(); }
    cargando = true;
    return api({ accion: 'listar' }).then(function(r){
      cargando = false;
      if(r.status === 404){ enlaceMuerto(); return; }
      if(r.status === 429){ conectado(true); return; }
      if(!r.ok || !r.d){ conectado(false); if(!ultimoOk) falloInicial(r); else if(window.PuveCarga){ var inf = PuveCarga.diagnosticar(null, r.status); avisar(inf.titulo + '. ' + inf.pasos[0]); } return; }
      conectado(true); ultimoOk = Date.now(); ocultarFalloInicial();
      if(r.d.ahora) offsetReloj = new Date(r.d.ahora).getTime() - Date.now();
      datos = { negocio: r.d.negocio || '', plano: r.d.plano, canal: r.d.canal, pedidos: r.d.pedidos || [] };
      $('negocio').textContent = datos.negocio ? 'Cocina · ' + datos.negocio : 'Cocina'; document.title = (datos.negocio || 'Cocina') + ' · Cocina';
      var ids = {}, hayNuevo = false;
      datos.pedidos.forEach(function(p){ ids[p.id] = 1; if(conocidos && !conocidos[p.id] && p.estado === 'por_confirmar') hayNuevo = true; });
      conocidos = ids; if(hayNuevo) avisoNuevo();
      pintar(); suscribir(); if(!menu.length && !menuCargado) cargarMenu();
    }).then(function(){ if(otraVez){ otraVez = false; cargar(); } });
  }
  function suscribir(){
    if(!datos.canal || !window.supabase || datos.canal === canalNombre) return;
    try {
      if(!cliente) cliente = window.supabase.createClient(SUPA, KEY, { auth: { persistSession: false, autoRefreshToken: false } });
      if(canalRt) cliente.removeChannel(canalRt);
      canalNombre = datos.canal;
      // El aviso no trae datos: solo dice "algo cambió"; la lista siempre se pide al servidor con el token.
      canalRt = cliente.channel('cocina:' + datos.canal).on('broadcast', { event: 'cambio' }, function(){ cargar(); }).on('broadcast', { event: 'menu' }, function(){ cargarMenu(); }).subscribe();
    } catch(e){ canalNombre = null; }
  }
  if(DEMO){ window.PuveDemo.suscribir(cargar); setInterval(cargar, 3000); }
  setInterval(function(){ cargar(); if($('ov86').style.display === 'flex') cargarMenu(); }, 30000);   // respaldo por si se pierde un aviso
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) cargar(); });
  window.addEventListener('online', cargar); window.addEventListener('offline', function(){ conectado(false); });
  setInterval(function(){   // cronómetros vivos
    $('reloj').textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    Array.prototype.forEach.call(document.querySelectorAll('.t[data-d]'), function(e){ e.textContent = mmss(e.dataset.d); });
    Array.prototype.forEach.call(document.querySelectorAll('.barra i'), pintaBarra);
    if(ultimoOk && Date.now() - ultimoOk > 70000) conectado(false);
  }, 1000);
  setInterval(function(){ if(datos.pedidos.length) pintar(); }, 30000);   // reevalúa colores de retraso

  // Botón 86 (agotado en vivo)
  function cargarMenu(){ return api({ accion: 'menu' }).then(function(r){ if(!r.ok || !r.d) return; menu = r.d.menu || []; menuCargado = true; pintar86(); }); }
  function pintar86(){
    var n = menu.filter(function(x){ return x.agotado; }).length;
    $('b86').textContent = n ? '86 · ' + n + ' agotado' + (n > 1 ? 's' : '') : '86 · Agotados'; $('b86').className = 'btn lbl' + (n ? ' rojo' : '');
    var q = $('b86Buscar').value.trim().toLowerCase(), l = $('l86'), vistos = 0, ult = null; l.textContent = '';
    menu.slice().sort(function(a, b){ return (b.agotado - a.agotado) || String(a.categoria || '').localeCompare(String(b.categoria || '')) || a.nombre.localeCompare(b.nombre); }).forEach(function(x){
      if(q && x.nombre.toLowerCase().indexOf(q) === -1) return;
      var g = x.agotado ? 'Agotados ahora' : (x.categoria || 'Sin categoría');
      if(g !== ult){ l.appendChild(mk('div', 'g86', g)); ult = g; }
      var f = mk('div', 'r86' + (x.agotado ? ' ago' : '')); f.appendChild(mk('span', 'n', x.nombre));
      var b = mk('button', 'btn', x.agotado ? 'Quitar 86' : 'Agotar'); b.type = 'button'; b.onclick = function(){ b.disabled = true; alternar86(x); };
      f.appendChild(b); l.appendChild(f); vistos++;
    });
    if(!vistos) l.appendChild(mk('div', 'vacio', menu.length ? 'Sin resultados' : 'No hay platillos con existencias.'));
  }
  function alternar86(x){
    api({ accion: 'agotar', id: x.id, agotado: !x.agotado }).then(function(r){
      if(r.status === 404){ enlaceMuerto(); return; }
      if(!r.ok) avisar((r.d && r.d.error) || 'No se pudo cambiar. Revisa la conexión.');
      cargarMenu();
    });
  }
  function cerrar86(){ $('ov86').style.display = 'none'; }
  $('b86').onclick = function(){ $('ov86').style.display = 'flex'; $('b86Buscar').value = ''; cargarMenu(); };
  $('c86').onclick = cerrar86; $('ov86').addEventListener('click', function(e){ if(e.target === $('ov86')) cerrar86(); });
  $('b86Buscar').oninput = pintar86;

  // Ajustes
  function panel(ab){ $('ajPanel').classList.toggle('ab', ab); $('bAj').setAttribute('aria-expanded', ab ? 'true' : 'false'); }
  $('bAj').onclick = function(e){ e.stopPropagation(); panel(!$('ajPanel').classList.contains('ab')); };
  document.addEventListener('click', function(e){ if(!$('ajPanel').contains(e.target)) panel(false); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ panel(false); cerrar86(); } });
  function pSonido(){ $('bSonido').textContent = sonar ? 'Activado' : 'Apagado'; $('bSonido').className = 'btn' + (sonar ? ' on' : ''); }
  $('bSonido').onclick = function(){ sonar = !sonar; LS.set('puve_cocina_sonido', sonar ? '1' : '0'); pSonido(); if(sonar) avisoNuevo(); }; pSonido();
  $('bTema').onclick = function(){ oscuro = !oscuro; LS.set('puve_cocina_tema', oscuro ? 'oscuro' : 'claro'); tema(); pintar(); };
  function z(d){ zoom = Math.min(1.8, Math.max(0.8, Math.round((zoom + d) * 10) / 10)); LS.set('puve_cocina_zoom', String(zoom)); document.documentElement.style.setProperty('--z', zoom); }
  $('bMas').onclick = function(){ z(0.1); }; $('bMenos').onclick = function(){ z(-0.1); };
  $('bPantalla').onclick = function(){ var d = document.documentElement; if(document.fullscreenElement) document.exitFullscreen(); else if(d.requestFullscreen) d.requestFullscreen(); };
  document.addEventListener('fullscreenchange', function(){ $('bPantalla').textContent = document.fullscreenElement ? 'Salir' : 'Activar'; });
  if(!document.documentElement.requestFullscreen) $('bPantalla').parentNode.style.display = 'none';   // iPhone y algunos navegadores no la ofrecen

  // Mantener la pantalla encendida (donde el navegador lo permite)
  var bloqueo = null;
  function pedirBloqueo(){ try { if(navigator.wakeLock && !document.hidden) navigator.wakeLock.request('screen').then(function(w){ bloqueo = w; }).catch(function(){}); } catch(e){} }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) pedirBloqueo(); });
  pedirBloqueo(); document.addEventListener('click', function once(){ if(!bloqueo) pedirBloqueo(); document.removeEventListener('click', once); });

  conectado(false); marcarTabs(); cargar();
})();
</script>
