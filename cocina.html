<html lang="es">
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<style>
  :root{ --fondo:#0f1318; --panel:#171c23; --panel2:#1e2530; --linea:#2b3340; --texto:#f3f4f6; --suave:#9aa4b2; --azul:#3b82f6; --ambar:#f59e0b; --verde:#22c55e; --rojo:#ef4444; --z:1; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--fondo); color:var(--texto); font:calc(16px * var(--z))/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body{ display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button{ font:inherit; color:inherit; cursor:pointer; }
  header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--linea); }
  header h1{ margin:0; font-size:1.15em; }
  header .sub{ color:var(--suave); font-size:.85em; }
  .grow{ flex:1; }
  .chip{ border:1px solid var(--linea); background:var(--panel2); border-radius:999px; padding:6px 12px; font-size:.85em; }
  .chip.on{ background:var(--azul); border-color:var(--azul); color:#fff; }
  .punto{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--verde); margin-right:6px; }
  .punto.off{ background:var(--rojo); }
  #aviso{ display:none; background:#7c2d12; color:#fff; padding:8px 14px; font-weight:600; }
  #filtros{ display:flex; gap:8px; overflow-x:auto; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--linea); }
  #filtros:empty{ display:none; }
  main{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,34%); gap:12px; padding:12px; }
  main.sinplano{ grid-template-columns:1fr; }
  #izq{ min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .col{ min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--linea); border-radius:12px; overflow:hidden; }
  .col h2{ margin:0; padding:10px 12px; font-size:.95em; letter-spacing:.04em; text-transform:uppercase; display:flex; justify-content:space-between; border-bottom:3px solid var(--c); }
  .col h2 b{ background:var(--c); color:#fff; border-radius:999px; padding:0 10px; }
  .lista{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .vacio{ color:var(--suave); text-align:center; padding:24px 8px; font-size:.9em; }
  .tarjeta{ background:var(--panel2); border:1px solid var(--linea); border-left:6px solid var(--c); border-radius:10px; padding:10px 12px; }
  .tarjeta.sel{ outline:3px solid #fff; }
  .tarjeta.urgente{ border-left-color:var(--rojo); box-shadow:0 0 0 1px var(--rojo) inset; }
  .tarjeta.nuevo{ animation:parp 1.2s ease-in-out infinite; }
  @keyframes parp{ 50%{ background:#1f3254; } }
  @media (prefers-reduced-motion:reduce){ .tarjeta.nuevo{ animation:none; } }
  .cab{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .mesa{ font-size:1.6em; font-weight:800; }
  .alias{ color:var(--suave); font-size:.85em; }
  .tiempo{ font-variant-numeric:tabular-nums; font-weight:700; }
  .tiempo.tarde{ color:var(--rojo); }
  .item{ margin:6px 0 0; font-size:1.1em; font-weight:600; }
  .item small{ display:block; color:var(--suave); font-weight:400; font-size:.8em; }
  .cat{ font-size:.7em; color:var(--suave); text-transform:uppercase; letter-spacing:.05em; margin-top:8px; }
  .nota{ margin-top:8px; background:#3b2a05; border:1px solid #92650a; border-radius:8px; padding:6px 8px; font-weight:600; }
  .acc{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .acc button{ flex:1; min-width:64px; border:0; border-radius:8px; padding:12px 8px; font-weight:700; background:var(--ambar); color:#1a1200; }
  .acc button.verde{ background:var(--verde); color:#04200e; font-size:1.05em; }
  .acc button:disabled{ opacity:.5; }
  .esp{ color:var(--suave); font-size:.85em; margin-top:8px; }
  #der{ min-height:0; display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--linea); border-radius:12px; padding:10px; }
  #der h2{ margin:0; font-size:.95em; text-transform:uppercase; letter-spacing:.04em; }
  #plano{ width:100%; height:auto; border-radius:10px; }
  .leyenda{ display:flex; gap:10px; flex-wrap:wrap; font-size:.75em; color:var(--suave); }
  .leyenda i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; }
  #bandeja{ display:flex; gap:6px; flex-wrap:wrap; }
  #ov86{ display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.72); align-items:center; justify-content:center; padding:14px; }
  #ov86 .caja{ background:var(--panel); border:1px solid var(--linea); border-radius:14px; width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; }
  #ov86 .cab86{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--linea); }
  #ov86 .cab86 h2{ margin:0; font-size:1.1em; flex:1; }
  #ov86 input{ width:calc(100% - 28px); margin:10px 14px 0; padding:10px 12px; font:inherit; color:var(--texto); background:var(--panel2); border:1px solid var(--linea); border-radius:8px; }
  #l86{ overflow-y:auto; padding:8px 14px 14px; }
  .r86{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--linea); }
  .r86 .n{ flex:1; font-weight:600; }
  .r86.ago .n{ color:var(--rojo); text-decoration:line-through; }
  .r86 button{ border:0; border-radius:8px; padding:10px 14px; font-weight:700; background:var(--panel2); border:1px solid var(--linea); }
  .r86.ago button{ background:var(--rojo); border-color:var(--rojo); color:#fff; }
  .c86{ margin-top:10px; font-size:.7em; letter-spacing:.05em; text-transform:uppercase; color:var(--suave); }
  #pantallaError{ display:none; flex:1; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #pantallaError div{ max-width:420px; }
  @media (max-width:1000px){ main{ grid-template-columns:1fr; overflow-y:auto; } #izq{ grid-template-columns:1fr; } .col{ max-height:none; } #der{ order:-1; } }
</style>
</head>
<body>
<header>
  <div><h1 id="negocio">Cocina</h1><div class="sub"><span class="punto off" id="punto"></span><span id="estadoRed">Conectando…</span> · <span id="reloj"></span></div></div>
  <div class="grow"></div>
  <button class="chip" id="b86" type="button">86 · Agotados</button>
  <button class="chip" id="bSonido" type="button">🔔 Sonido: sí</button>
  <button class="chip" id="bMenos" type="button" aria-label="Letra más pequeña">A−</button>
  <button class="chip" id="bMas" type="button" aria-label="Letra más grande">A+</button>
  <button class="chip" id="bPantalla" type="button">Pantalla completa</button>
</header>
<div id="aviso" role="status"></div>
<div id="filtros" aria-label="Filtrar por estación"></div>
<div id="pantallaError"><div><h1 id="errTitulo">Enlace no válido</h1><p id="errTexto" style="color:var(--suave)">Pide uno nuevo al encargado.</p></div></div>
<main id="principal">
  <section id="izq">
    <div class="col" style="--c:var(--azul)"><h2>Nuevos <b id="nNuevos">0</b></h2><div class="lista" id="lNuevos"></div></div>
    <div class="col" style="--c:var(--ambar)"><h2>En preparación <b id="nPrep">0</b></h2><div class="lista" id="lPrep"></div></div>
    <div class="col" style="--c:var(--verde)"><h2>Listos <b id="nListos">0</b></h2><div class="lista" id="lListos"></div></div>
  </section>
  <aside id="der">
    <h2>Salón</h2>
    <svg id="plano" role="img" aria-label="Plano del salón con los pedidos activos"></svg>
    <div class="leyenda"><span><i style="background:var(--azul)"></i>Nuevo</span><span><i style="background:var(--ambar)"></i>Preparando</span><span><i style="background:var(--verde)"></i>Listo</span><span><i style="background:var(--rojo)"></i>Tarde</span></div>
    <div id="bandeja"></div>
  </aside>
</main>
<div id="ov86" role="dialog" aria-modal="true" aria-label="Platillos agotados (86)">
  <div class="caja">
    <div class="cab86"><h2>86 · Platillos agotados</h2><button class="chip" id="c86" type="button">Cerrar</button></div>
    <input id="b86Buscar" type="search" placeholder="Buscar platillo…" autocomplete="off">
    <div id="l86"></div>
  </div>
</div>
<script src="plano-salon.js"></script>
<script>
(function(){
  'use strict';
  var SUPA = 'https://ckzueunptmlqmtypowmg.supabase.co', KEY = 'sb_publishable_jkE5ikAW_a0OfE2S-6u3VA_P8uEzUSp';
  var LS = { get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} }, del: function(k){ try { localStorage.removeItem(k); } catch(e){} } };
  var $ = function(id){ return document.getElementById(id); };
  var mk = function(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };

  // ----- token: viene en el # del enlace (nunca viaja al servidor del sitio) y se recuerda en este dispositivo -----
  var m = /(?:^|[#&])t=([0-9a-f]{48})(?:&|$)/.exec(location.hash || '');
  var TOKEN = m ? m[1] : (LS.get('puve_cocina_t') || '');
  if(m){ LS.set('puve_cocina_t', TOKEN); try { history.replaceState(null, '', location.pathname); } catch(e){} }

  var datos = { negocio: '', plano: null, canal: null, pedidos: [] };
  var offsetReloj = 0;                // diferencia entre el reloj del servidor y el de la tablet
  var filtro = null;                   // estación (categoría) elegida
  var seleccion = null;                // mesa resaltada
  var conocidos = null;                // ids ya vistos (para sonar solo con pedidos nuevos)
  var sonar = LS.get('puve_cocina_sonido') !== '0';
  var zoom = Number(LS.get('puve_cocina_zoom')) || 1;
  var canalRt = null, canalNombre = null, cliente = null, cargando = false, otraVez = false, ultimoOk = 0, enviando = {}, muerto = false, menu = [];
  document.documentElement.style.setProperty('--z', zoom);

  function mostrarError(t, x){ muerto = true; $('principal').style.display = 'none'; $('filtros').style.display = 'none'; var p = $('pantallaError'); p.style.display = 'flex'; $('errTitulo').textContent = t; $('errTexto').textContent = x; }
  if(!TOKEN){ mostrarError('Falta el enlace de cocina', 'Abre el enlace completo que te dio el encargado. Si lo perdiste, pídele uno nuevo.'); return; }

  function api(body){
    body.token = TOKEN;
    return fetch(SUPA + '/functions/v1/cocina-pedidos', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return null; }).then(function(d){ return { ok: r.ok, status: r.status, d: d }; }); })
      .catch(function(){ return { ok: false, status: 0, d: null }; });
  }

  // ----- Audio (sonidos fabricados, sin archivos) -----
  var ctxAudio = null;
  function audio(){ try { var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; if(!ctxAudio) ctxAudio = new C(); if(ctxAudio.state === 'suspended') ctxAudio.resume(); return ctxAudio; } catch(e){ return null; } }
  ['click', 'touchstart', 'keydown'].forEach(function(ev){ document.addEventListener(ev, audio, { passive: true }); });
  function timbre(freqs, dur){
    if(!sonar) return; var c = audio(); if(!c) return;
    try {
      var g = c.createGain(); g.connect(c.destination); var t0 = c.currentTime;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * freqs.length + 0.2);
      freqs.forEach(function(f, i){ var o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); o.start(t0 + i * dur); o.stop(t0 + i * dur + dur * 0.9); });
    } catch(e){}
  }
  var avisoNuevo = function(){ timbre([880, 1175, 1568], 0.16); };
  setInterval(function(){ if(sonar && datos.pedidos.some(function(p){ return p.estado === 'por_confirmar'; })) timbre([988, 988], 0.14); }, 45000);   // recordatorio mientras haya nuevos

  // ----- utilidades -----
  var ahora = function(){ return Date.now() + offsetReloj; };
  var minDesde = function(iso){ return Math.max(0, Math.floor((ahora() - new Date(iso).getTime()) / 60000)); };
  function urgente(p){
    var m = minDesde(p.creado_en);
    if(p.estado === 'listo') return minDesde(p.actualizado_en) >= 8;
    if(p.estado === 'por_confirmar') return m >= 3;
    return p.minutos ? m > p.minutos : m >= 20;
  }
  function mmss(iso){ var s = Math.max(0, Math.floor((ahora() - new Date(iso).getTime()) / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function visibles(){ return !filtro ? datos.pedidos : datos.pedidos.filter(function(p){ return p.items.some(function(i){ return (i.categoria || 'Sin estación') === filtro; }); }); }

  // ----- tarjetas -----
  function tarjeta(p){
    var c = mk('div', 'tarjeta' + (p.estado === 'por_confirmar' ? ' nuevo' : '') + (urgente(p) ? ' urgente' : '') + (seleccion === p.mesa ? ' sel' : ''));
    c.style.setProperty('--c', p.estado === 'por_confirmar' ? 'var(--azul)' : (p.estado === 'preparando' ? 'var(--ambar)' : 'var(--verde)'));
    c.dataset.id = p.id;
    var cab = mk('div', 'cab'), izq = mk('div');
    izq.appendChild(mk('span', 'mesa', p.mesa === 'BARRA' ? 'BARRA' : 'Mesa ' + p.mesa));
    if(p.alias) izq.appendChild(mk('div', 'alias', p.alias));
    cab.appendChild(izq);
    var t = mk('span', 'tiempo' + (urgente(p) ? ' tarde' : ''), mmss(p.estado === 'listo' ? p.actualizado_en : p.creado_en)); t.dataset.desde = p.estado === 'listo' ? p.actualizado_en : p.creado_en;
    cab.appendChild(t); c.appendChild(cab);
    if(p.estado === 'preparando' && p.minutos) c.appendChild(mk('div', 'esp', 'Prometido: ' + p.minutos + ' min'));
    var ult = null;
    p.items.forEach(function(i){
      var cat = i.categoria || 'Sin estación';
      if(!filtro && cat !== ult){ c.appendChild(mk('div', 'cat', cat)); ult = cat; }
      var d = mk('div', 'item', i.cantidad + ' × ' + i.nombre);
      if(filtro && cat !== filtro) d.style.opacity = '.45';
      var ops = (i.opciones || []).map(function(o){ return o.o ? (o.g ? o.g + ': ' : '') + o.o : (o.nombre || ''); }).filter(Boolean).join(' · ');
      if(ops) d.appendChild(mk('small', null, ops));
      c.appendChild(d);
    });
    if(p.nota) c.appendChild(mk('div', 'nota', '📝 ' + p.nota));
    var acc = mk('div', 'acc');
    if(p.estado === 'por_confirmar'){
      [10, 15, 20, 30].forEach(function(mn){ var b = mk('button', null, 'Aceptar ' + mn + ' min'); b.onclick = function(ev){ ev.stopPropagation(); cambiar(p, 'preparando', mn, b); }; acc.appendChild(b); });
    } else if(p.estado === 'preparando'){
      var bl = mk('button', 'verde', '✓ Listo'); bl.onclick = function(ev){ ev.stopPropagation(); cambiar(p, 'listo', null, bl); }; acc.appendChild(bl);
    } else { c.appendChild(mk('div', 'esp', 'Listo — esperando al mesero')); }
    if(acc.children.length) c.appendChild(acc);
    c.onclick = function(){ seleccion = seleccion === p.mesa ? null : p.mesa; pintar(); };
    return c;
  }

  function cambiar(p, estado, minutos, boton){
    if(enviando[p.id]) return; enviando[p.id] = true; boton.disabled = true;
    api({ accion: 'estado', id: p.id, estado: estado, minutos: minutos }).then(function(r){
      delete enviando[p.id];
      if(r.status === 404){ mostrarError('Este enlace ya no es válido', 'Pide uno nuevo al encargado.'); LS.del('puve_cocina_t'); return; }
      if(!r.ok){ avisar((r.d && r.d.error) || 'No se pudo cambiar el pedido. Revisa la conexión.'); }
      cargar();
    });
  }

  function avisar(t){ var a = $('aviso'); a.textContent = t; a.style.display = 'block'; clearTimeout(avisar.t); avisar.t = setTimeout(function(){ a.style.display = 'none'; }, 6000); }

  // ----- pintar -----
  function estadosPorMesa(){
    var out = {};
    datos.pedidos.forEach(function(p){
      var e = out[p.mesa] || { estado: p.estado, n: 0, minutos: 0, urgente: false }, orden = { por_confirmar: 3, preparando: 2, listo: 1 };
      e.n++; if(orden[p.estado] > orden[e.estado]) e.estado = p.estado;
      e.minutos = Math.max(e.minutos, minDesde(p.estado === 'listo' ? p.actualizado_en : p.creado_en)); if(urgente(p)) e.urgente = true;
      out[p.mesa] = e;
    });
    return out;
  }
  function pintar(){
    var v = visibles(), col = { por_confirmar: $('lNuevos'), preparando: $('lPrep'), listo: $('lListos') }, cnt = { por_confirmar: 0, preparando: 0, listo: 0 };
    var scroll = {}, scrollMain = $('principal').scrollTop; Object.keys(col).forEach(function(k){ scroll[k] = col[k].scrollTop; col[k].textContent = ''; });
    // los más antiguos arriba; los listos, los que llevan más esperando arriba
    v.forEach(function(p){ cnt[p.estado]++; col[p.estado].appendChild(tarjeta(p)); });
    Object.keys(col).forEach(function(k){ if(!cnt[k]) col[k].appendChild(mk('div', 'vacio', k === 'por_confirmar' ? 'Sin pedidos nuevos' : (k === 'preparando' ? 'Nada en preparación' : 'Nada por entregar'))); });
    Object.keys(col).forEach(function(k){ col[k].scrollTop = scroll[k]; });
    $('nNuevos').textContent = cnt.por_confirmar; $('nPrep').textContent = cnt.preparando; $('nListos').textContent = cnt.listo;

    // filtros por estación (categorías de los productos pedidos)
    var cats = {}; datos.pedidos.forEach(function(p){ p.items.forEach(function(i){ cats[i.categoria || 'Sin estación'] = 1; }); });
    var nombres = Object.keys(cats).sort(), f = $('filtros'); f.textContent = '';
    if(filtro && !cats[filtro]) filtro = null;
    if(nombres.length > 1){
      var todo = mk('button', 'chip' + (!filtro ? ' on' : ''), 'Todo'); todo.onclick = function(){ filtro = null; pintar(); }; f.appendChild(todo);
      nombres.forEach(function(n){ var b = mk('button', 'chip' + (filtro === n ? ' on' : ''), n); b.onclick = function(){ filtro = n; pintar(); }; f.appendChild(b); });
    }
    pintarPlano(); $('principal').scrollTop = scrollMain;
  }
  function pintarPlano(){
    var tienePlano = datos.plano && datos.plano.elementos && datos.plano.elementos.length, est = estadosPorMesa();
    $('principal').classList.toggle('sinplano', !tienePlano && !Object.keys(est).length);
    $('der').style.display = tienePlano || Object.keys(est).length ? '' : 'none';
    $('plano').style.display = tienePlano ? '' : 'none';
    if(tienePlano) window.PuvePlano.dibujar($('plano'), datos.plano, { tema: 'oscuro', estados: est, seleccion: seleccion, onMesa: function(mesa){ seleccion = seleccion === mesa ? null : mesa; pintar(); var t = document.querySelector('.tarjeta.sel'); if(t) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } });
    // Pedidos de mesas que no están dibujadas en el plano
    var dibujadas = {}; if(tienePlano) datos.plano.elementos.forEach(function(e){ if(e.mesa) dibujadas[e.mesa] = 1; });
    var b = $('bandeja'); b.textContent = '';
    Object.keys(est).filter(function(mesa){ return !dibujadas[mesa]; }).forEach(function(mesa){
      var chip = mk('button', 'chip' + (seleccion === mesa ? ' on' : ''), (mesa === 'BARRA' ? 'Barra' : 'Mesa ' + mesa) + ' · ' + est[mesa].n); chip.onclick = function(){ seleccion = seleccion === mesa ? null : mesa; pintar(); }; b.appendChild(chip);
    });
  }

  // ----- carga y tiempo real -----
  function conectado(ok){ $('punto').className = 'punto' + (ok ? '' : ' off'); $('estadoRed').textContent = ok ? 'En vivo' : 'Sin conexión — reintentando…'; }
  function cargar(){
    if(muerto) return Promise.resolve();
    if(cargando){ otraVez = true; return Promise.resolve(); }
    cargando = true;
    return api({ accion: 'listar' }).then(function(r){
      cargando = false;
      if(r.status === 404){ LS.del('puve_cocina_t'); mostrarError('Este enlace ya no es válido', 'Pide uno nuevo al encargado.'); return; }
      if(r.status === 429){ conectado(true); return; }
      if(!r.ok || !r.d){ conectado(false); return; }
      conectado(true); ultimoOk = Date.now();
      if(r.d.ahora) offsetReloj = new Date(r.d.ahora).getTime() - Date.now();
      datos = { negocio: r.d.negocio || '', plano: r.d.plano, canal: r.d.canal, pedidos: r.d.pedidos || [] };
      $('negocio').textContent = datos.negocio ? 'Cocina · ' + datos.negocio : 'Cocina'; document.title = (datos.negocio || 'Cocina') + ' · Cocina';
      var ids = {}, hayNuevo = false;
      datos.pedidos.forEach(function(p){ ids[p.id] = 1; if(conocidos && !conocidos[p.id] && p.estado === 'por_confirmar') hayNuevo = true; });
      conocidos = ids; if(hayNuevo) avisoNuevo();
      pintar(); suscribir(); if(!menu.length && !menuCargado) cargarMenu();
    }).then(function(){ if(otraVez){ otraVez = false; cargar(); } });
  }
  function suscribir(){
    if(!datos.canal || !window.supabase || datos.canal === canalNombre) return;
    try {
      if(!cliente) cliente = window.supabase.createClient(SUPA, KEY, { auth: { persistSession: false, autoRefreshToken: false } });
      if(canalRt) cliente.removeChannel(canalRt);
      canalNombre = datos.canal;
      // El aviso no trae datos: solo dice "algo cambió"; la lista siempre se pide al servidor con el token.
      canalRt = cliente.channel('cocina:' + datos.canal).on('broadcast', { event: 'cambio' }, function(){ cargar(); }).on('broadcast', { event: 'menu' }, function(){ cargarMenu(); }).subscribe();
    } catch(e){ canalNombre = null; }
  }
  setInterval(function(){ cargar(); if($('ov86').style.display === 'flex') cargarMenu(); }, 30000);                         // respaldo por si se pierde un aviso
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) cargar(); });
  window.addEventListener('online', cargar);
  window.addEventListener('offline', function(){ conectado(false); });
  // cronómetros vivos
  setInterval(function(){
    $('reloj').textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    document.querySelectorAll('.tiempo[data-desde]').forEach(function(e){ e.textContent = mmss(e.dataset.desde); });
    if(Date.now() - ultimoOk > 70000 && ultimoOk) conectado(false);
  }, 1000);
  setInterval(function(){ if(datos.pedidos.length) pintar(); }, 30000);  // reevalúa colores de retraso

  // ----- Botón 86 (agotado en vivo) -----
  var menuCargado = false;
  function cargarMenu(){
    return api({ accion: 'menu' }).then(function(r){
      if(!r.ok || !r.d) return; menu = r.d.menu || []; menuCargado = true; pintar86();
    });
  }
  function pintar86(){
    var n = menu.filter(function(m){ return m.agotado; }).length;
    $('b86').textContent = n ? '86 · ' + n + ' agotado' + (n > 1 ? 's' : '') : '86 · Agotados';
    $('b86').className = 'chip' + (n ? ' on' : ''); if(n) $('b86').style.background = 'var(--rojo)', $('b86').style.borderColor = 'var(--rojo)'; else { $('b86').style.background = ''; $('b86').style.borderColor = ''; }
    var q = $('b86Buscar').value.trim().toLowerCase(), l = $('l86'); l.textContent = '';
    var vistos = 0, ult = null;
    // los agotados primero, luego por categoría
    menu.slice().sort(function(a, b){ return (b.agotado - a.agotado) || String(a.categoria || '').localeCompare(String(b.categoria || '')) || a.nombre.localeCompare(b.nombre); }).forEach(function(m){
      if(q && m.nombre.toLowerCase().indexOf(q) === -1) return;
      var grupo = m.agotado ? 'Agotados ahora' : (m.categoria || 'Sin categoría');
      if(grupo !== ult){ l.appendChild(mk('div', 'c86', grupo)); ult = grupo; }
      var f = mk('div', 'r86' + (m.agotado ? ' ago' : '')); f.appendChild(mk('span', 'n', m.nombre));
      var b = mk('button', null, m.agotado ? 'Quitar 86' : 'Agotar'); b.onclick = function(){ b.disabled = true; alternar86(m); };
      f.appendChild(b); l.appendChild(f); vistos++;
    });
    if(!vistos) l.appendChild(mk('div', 'vacio', menu.length ? 'Sin resultados' : 'No hay platillos con existencias.'));
  }
  function alternar86(m){
    api({ accion: 'agotar', id: m.id, agotado: !m.agotado }).then(function(r){
      if(r.status === 404){ mostrarError('Este enlace ya no es válido', 'Pide uno nuevo al encargado.'); LS.del('puve_cocina_t'); return; }
      if(!r.ok) avisar((r.d && r.d.error) || 'No se pudo cambiar. Revisa la conexión.');
      cargarMenu();
    });
  }
  $('b86').onclick = function(){ $('ov86').style.display = 'flex'; $('b86Buscar').value = ''; cargarMenu(); };
  $('c86').onclick = function(){ $('ov86').style.display = 'none'; };
  $('ov86').addEventListener('click', function(e){ if(e.target === $('ov86')) $('ov86').style.display = 'none'; });
  $('b86Buscar').oninput = pintar86;

  // ----- controles -----
  $('bSonido').onclick = function(){ sonar = !sonar; LS.set('puve_cocina_sonido', sonar ? '1' : '0'); $('bSonido').textContent = '🔔 Sonido: ' + (sonar ? 'sí' : 'no'); if(sonar) avisoNuevo(); };
  $('bSonido').textContent = '🔔 Sonido: ' + (sonar ? 'sí' : 'no');
  function z(d){ zoom = Math.min(1.8, Math.max(0.8, Math.round((zoom + d) * 10) / 10)); LS.set('puve_cocina_zoom', String(zoom)); document.documentElement.style.setProperty('--z', zoom); }
  $('bMas').onclick = function(){ z(0.1); }; $('bMenos').onclick = function(){ z(-0.1); };
  $('bPantalla').onclick = function(){ var d = document.documentElement; if(document.fullscreenElement) document.exitFullscreen(); else if(d.requestFullscreen) d.requestFullscreen(); };
  // Mantener la pantalla encendida (donde el navegador lo permite)
  var bloqueo = null;
  function pedirBloqueo(){ try { if(navigator.wakeLock && !document.hidden) navigator.wakeLock.request('screen').then(function(w){ bloqueo = w; }).catch(function(){}); } catch(e){} }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) pedirBloqueo(); });
  pedirBloqueo(); document.addEventListener('click', function once(){ if(!bloqueo) pedirBloqueo(); document.removeEventListener('click', once); });

  conectado(false); cargar();
})();
</script>
